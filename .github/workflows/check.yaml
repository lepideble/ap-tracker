name: check

on:
  pull_request: ~

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: corepack enable
      - run: corepack install
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: 'yarn'
      - run: yarn install
      - run: yarn run build --base /ap-tracker/
